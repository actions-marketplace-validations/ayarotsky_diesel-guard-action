name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clean-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          path: tests/clean/

  unsafe-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: guard
        uses: ./
        continue-on-error: true
        with:
          path: tests/unsafe/
      - name: Assert the action failed
        if: steps.guard.outcome == 'success'
        run: |
          echo "Expected diesel-guard to flag unsafe migrations, but it passed"
          exit 1
